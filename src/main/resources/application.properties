# Application
spring.application.name=AthenaApi
server.port=8080

# AWS Credentials — use environment variables, never hardcode
aws.access-key=${AWS_ACCESS_KEY_ID:}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:ap-south-1}

# Athena Config
athena.database=${ATHENA_DATABASE:telemune_db}
athena.output-location=${ATHENA_OUTPUT_LOCATION:s3://telemune-athena-db-a/}
athena.workgroup=${ATHENA_WORKGROUP:primary}

# Query Settings
athena.query.timeout-seconds=${ATHENA_QUERY_TIMEOUT:300}
athena.query.max-results=${ATHENA_MAX_RESULTS:1000}
athena.query.poll-interval-ms=500

# Logging
logging.level.com.telemune=INFO
logging.level.software.amazon.awssdk=WARN
